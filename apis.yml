- aid: exentis-group:exentis-group-mcp-server
  name: Exentis Group MCP Server
  description: >-
    An MCP (Model Context Protocol) server endpoint mounted on www.exentis-group.com by the WordPress
    MCP adapter, alongside the WordPress Abilities API. The endpoint is really served — GET /wp-json/mcp
    enumerates it — but `tools/list` returns HTTP 401 rest_forbidden to anonymous callers, so the live
    tool set and its input schemas cannot be read without a WordPress application password. Recorded as
    present and auth-gated; no tool list is asserted.
  humanURL: https://www.exentis-group.com/wp-json/mcp
  baseURL: https://www.exentis-group.com/wp-json/mcp/mcp-adapter-default-server
  tags:
  - MCP

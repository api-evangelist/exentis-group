aid: exentis-group
name: Exentis Group
description: 'Exentis Group AG is a Swiss industrial technology company headquartered at Im Stetterfeld
  2 in Stetten (canton Aargau), near Zurich, with facilities and subsidiaries in Switzerland, Germany
  and the United States. It develops and sells the Exentis 3D Screen Printing platform — an additive
  manufacturing technology that builds parts layer by layer at room temperature through screen printing
  followed by sintering, with no lasers, no support structures and no rework, reaching wall thicknesses
  and cavities down to roughly 70 micrometres and producing undercuts and closed cavities. The company
  positions the platform for industrial series production rather than prototyping: a single production
  system is marketed as capable of millions of components per year, and in pharmaceuticals the process
  is used to mass-produce tablets with adjustable, controlled drug-release profiles. Its named market
  segments are pharma, new energy and ultra-fine industrial structures, in metals, technical ceramics
  and polymers, alongside cleanroom and bioprinting configurations. Exentis holds ISO 9001:2015
  certification for its Stetten head office and all German locations, and in Q4 2024 reported roughly
  USD 22 million in orders for nine production systems shipping to United States customers. It is a
  manufacturing-equipment vendor, not a software company: it publishes no developer portal, no product
  API, no SDKs, no pricing and no status page. The only machine-readable API surface on its public host
  is the WordPress REST API behind www.exentis-group.com, which serves the press room, blog, corporate
  pages, media library, taxonomies, site search and Polylang language configuration as JSON, read-only
  without credentials — plus an MCP server endpoint mounted by the WordPress MCP adapter, which is
  present but returns 401 to anonymous callers.'

note: >-
  Exentis Group documents no rate limits, because it documents no API. The WordPress REST API on
  www.exentis-group.com returns no rate-limit headers of any kind on an anonymous request — no
  X-RateLimit-*, no RateLimit-*, no Retry-After — so an agent has NO runtime signal to back off on and
  must self-throttle. That is the finding, and it is recorded as an honest zero rather than omitted.
  Server-side protection is presumed (Apache/WP Rocket sit in front of it) but is not advertised and
  was not triggered during this pass.

tools: []
tools_note: >-
  NO TOOL LIST IS ASSERTED. tools/list and initialize both return HTTP 401 rest_forbidden to
  anonymous callers, so the live tool set and the per-tool inputSchema cannot be read without a
  WordPress application password. Deriving a candidate tool list from the WordPress Abilities API
  would be a guess about what this specific site registered, so none is written. The tool set can only
  be enumerated by an authenticated introspection the provider would have to run.

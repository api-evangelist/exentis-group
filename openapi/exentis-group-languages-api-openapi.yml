openapi: 3.2.0
info:
  title: Exentis Group Languages API
  version: 1.0.0
  description: The Polylang language configuration for www.exentis-group.com — the site is published in German (de_CH, default) and English (en_US), and this endpoint is what tells a client which locales exist, which is default, their home and search URLs and their content counts.
  contact:
    name: Exentis Group AG
    email: info@exentis-group.com
    url: https://www.exentis-group.com/en/contact/
  termsOfService: https://www.exentis-group.com/en/terms-of-use/
  x-provenance:
    method: derived
    source: https://www.exentis-group.com/wp-json/
    derived: '2026-08-12'
    by: API Evangelist enrichment pipeline
servers:
- url: https://www.exentis-group.com/wp-json
  description: WordPress REST API root on the Exentis Group production host.
tags:
- name: Languages
paths:
  /pll/v1/languages:
    get:
      operationId: listLanguages
      summary: List configured site languages
      description: Returns every language configured in Polylang, with locale, slug, default flag, home URL, search URL and per-language content counts. No authentication required.
      tags:
      - Languages
      parameters: []
      responses:
        '200':
          description: The configured languages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
components:
  schemas:
    Language:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        term_group:
          type: integer
        term_id:
          type: integer
        locale:
          type: string
        is_rtl:
          type: boolean
        w3c:
          type: string
        facebook:
          type: string
        home_url:
          type: string
        search_url:
          type: string
        host:
          type: string
        page_on_front:
          type: integer
        page_for_posts:
          type: integer
        flag_code:
          type: string
        flag_url:
          type: string
        flag:
          type: string
        custom_flag_url:
          type: string
        custom_flag:
          type: string
        active:
          type: boolean
        fallbacks:
          type: array
          items: {}
        is_default:
          type: boolean
        term_props:
          type: object
          properties:
            language:
              type: object
              properties:
                term_id:
                  type: integer
                term_taxonomy_id:
                  type: integer
                count:
                  type: integer
            term_language:
              type: object
              properties:
                term_id:
                  type: integer
                term_taxonomy_id:
                  type: integer
                count:
                  type: integer
      description: Polylang language object. Structure derived from a live anonymous response; values are not reproduced here. Note `flag` carries an inline base64 data-URI image.
